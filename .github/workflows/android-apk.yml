name: Android APK

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = número de commits

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ferramentas Android (aapt2, dx, zipalign, apksigner)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner

      - run: npm ci

      - name: Gerar APK
        # Usa o mesmo toolchain do Ubuntu validado localmente (ignora o SDK pré-instalado do runner).
        run: ANDROID_HOME= bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MotionCut-apk
          path: android/build/*.apk
          if-no-files-found: error
